name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run CI without inventing a commit -- useful when a run failed for a
  # reason outside the code, such as the account being unable to start jobs.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # NO_COLOR so the counts can be read back out of the log below without
      # having to strip escape codes; vitest colours its output even when it
      # is being piped.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/vitest.txt"
        env:
          NO_COLOR: "1"

      # Same reasoning as the backend's: a green tick says vitest exited 0, not
      # how much of the suite it found.
      - name: Report the counts
        if: success() || failure()
        run: |
          if [ ! -f "$RUNNER_TEMP/vitest.txt" ]; then
            echo "::notice title=vitest::did not run"
            exit 0
          fi
          counts=$(grep -E '^ *(Test Files|Tests) ' "$RUNNER_TEMP/vitest.txt" |
            tr '\n' ' ' | tr -s ' ')
          echo "::notice title=vitest::${counts:-no output}"

      # Next 16 removed `next lint`, so the build is a separate check rather
      # than something the lint step covers.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # pipefail so the step still fails on a red suite despite the tee. No -q
      # here: pytest.ini already sets it, and a second one suppresses the
      # counts line the next step reports.
      - name: Test
        run: |
          set -o pipefail
          pytest --tb=short 2>&1 | tee "$RUNNER_TEMP/pytest.txt"

      # Annotations show up on the run page itself, so a build can be read
      # without downloading the log archive, which needs credentials.
      #
      # The counts go up even when the suite is green: a green tick only says
      # pytest exited 0, not how much it ran. A collection that quietly loses
      # a file looks identical from the outside.
      - name: Report the counts
        if: success() || failure()
        run: |
          if [ ! -f "$RUNNER_TEMP/pytest.txt" ]; then
            echo "::notice title=pytest::did not run"
            exit 0
          fi
          # pytest's counts are always its last non-empty line, however the
          # run ended. Matching on words like "passed" misses the endings that
          # lead with a deselected or error count.
          counts=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/pytest.txt" | tail -n 1)
          echo "::notice title=pytest::${counts:-no output}"

      - name: Surface the failures
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/pytest.txt" ] || exit 0
          grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.txt" | head -40 |
            while IFS= read -r line; do echo "::error::$line"; done
