name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run CI without inventing a commit -- useful when a run failed for a
  # reason outside the code, such as the account being unable to start jobs.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Next 16 removed `next lint`, so the build is a separate check rather
      # than something the lint step covers.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # pipefail so the step still fails on a red suite despite the tee.
      - name: Test
        run: |
          set -o pipefail
          pytest --tb=short -q 2>&1 | tee "$RUNNER_TEMP/pytest.txt"

      # Annotations show up on the run page itself, so a red build can be read
      # without downloading the log archive.
      - name: Surface the failures
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.txt" | head -40 |
            while IFS= read -r line; do echo "::error::$line"; done
          tail -n 3 "$RUNNER_TEMP/pytest.txt" |
            while IFS= read -r line; do echo "::error::$line"; done
